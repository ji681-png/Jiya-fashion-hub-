<!DOCTYPE html>
<html>
<head>
<title>Jiya Fashion Hub</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOP BAR -->
<div class="topbar">
<h2>Jiya Fashion Hub 💖</h2>
</div>

<!-- SEARCH BAR -->
<div class="search">
<input type="text" placeholder="Search for products">
</div>

<!-- CATEGORY -->
<div class="category">

<div class="cat">
<img src="kurti.jpg">
<p>Kurti</p>
</div>

<div class="cat">
<img src="saree.jpg">
<p>Saree</p>
</div>

<div class="cat">
<img src="suit.jpg">
<p>Suit</p>
</div>

<div class="cat">
<img src="bag.jpg">
<p>Bag</p>
</div>

</div>

<!-- SLIDER -->
<div class="slider">
<img id="slide" src="banner1.jpg">
</div>

<!-- PRODUCTS -->
<div class="products">

<div class="card">
<img src="kurti.jpg">
<h3>Designer Kurti</h3>
<p>₹999</p>
<a href="https://wa.me/918736095356?text=I%20want%20this%20product">
<button>Order</button>
</a>
</div>

<div class="card">
<img src="saree.jpg">
<h3>Party Saree</h3>
<p>₹1499</p>
<button>Order</button>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="bottom">
<p>🏠 Home</p>
<p>📦 Orders</p>
<p>🛒 Cart</p>
<p>👤 Account</p>
</div>

<script>
let images=["banner1.jpg","banner2.jpg","banner3.jpg"];
let i=0;
setInterval(()=>{
i=(i+1)%images.length;
document.getElementById("slide").src=images[i];
},2000);
</script>

</body>
</html>
